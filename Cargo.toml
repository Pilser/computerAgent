[workspace]
resolver = "2"
members = [
    "crates/agent",
    "crates/command-api",
    "crates/engine",
    "crates/frontend-slint",
    "crates/frontend-tauri",
    "crates/policy",
    "crates/session-store",
    "crates/sys-tools",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt"] }

# Release tuning lives here so that .github/workflows/release.yml is the
# ONLY place that ever triggers a --release build (see AGENTS.md §3).
# Local runs must stay on check/test via scripts/ram-check.sh + ram-test.sh.
[profile.release]
lto = "thin"
strip = true
codegen-units = 1
