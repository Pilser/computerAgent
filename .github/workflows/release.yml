name: release

# The ONLY place that may run `cargo build --release`.
# Never build releases locally or on PR (see AGENTS.md §1, §3).
# Release-only: no check/test jobs here. Build cache is restored
# before the build and saved after, so the next run reuses it.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps for Slint (fontconfig; Tauri webkit lands with tauri-app) + eframe link deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: computerAgent-release
      - name: build release (capped for small runner)
        run: cargo build --release --jobs 2
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: computerAgent-${{ github.ref_name }}
          path: |
            target/release/computerAgent*
            target/release/computer-agent*
            target/release/computer-agent-egui*
          if-no-files-found: warn
