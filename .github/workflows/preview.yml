name: preview

# Visual proof for the Slint UI without any local build.
# Uses the upstream prebuilt slint-viewer (pinned to our Cargo.lock Slint),
# so no compile happens here either: --check validates, --screenshot renders.
# Fires on the same tags as release, plus manual dispatch.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: viewer runtime deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libx11-xcb1 libxcb1 libxkbcommon0 libinput10 libgbm1
      - name: fetch prebuilt slint-viewer 1.18.1
        run: |
          gh release download v1.18.1 -R slint-ui/slint \
            -p 'slint-viewer-linux.tar.gz' -D /tmp/viewer
          tar xzf /tmp/viewer/slint-viewer-linux.tar.gz -C /tmp/viewer
          BIN=$(find /tmp/viewer -name 'slint-viewer' -type f | head -1)
          echo "VIEWER=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version
        env:
          GH_TOKEN: ${{ github.token }}
      - name: check slint files
        run: |
          "$VIEWER" --check crates/frontend-slint/ui/appwindow.slint
      - name: render screenshots (headless)
        run: |
          mkdir -p preview-out
          SLINT_SCALE_FACTOR=1 "$VIEWER" --screenshot \
            preview-out/chat-default.png \
            crates/frontend-slint/ui/appwindow.slint
      - name: upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.ref_name }}
          path: preview-out/
          if-no-files-found: error

  egui-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps (eframe link + xvfb + software GL/Vulkan + capture)
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-0 libssl-dev
          xvfb mesa-vulkan-drivers libgl1-mesa-dri scrot
      - name: restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: computerAgent-preview-egui
      - name: build desktop-egui (debug, capped)
        run: cargo build -p computer-agent-desktop-egui --jobs 2
      - name: capture fresh + seeded windows under xvfb
        run: |
          mkdir -p preview-out
          cp -r crates/frontend-egui/tests/fixtures/seeded /tmp/egui-seed
          chmod -R u+w /tmp/egui-seed
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            rm -rf /tmp/egui-fresh; mkdir -p /tmp/egui-fresh
            CA_DATA_DIR=/tmp/egui-fresh ./target/debug/computer-agent-egui & echo $! > /tmp/egui-app.pid
            sleep 15
            scrot /tmp/shot-fresh.png
            kill $(cat /tmp/egui-app.pid); wait 2>/dev/null; sleep 1
            CA_DATA_DIR=/tmp/egui-seed ./target/debug/computer-agent-egui & echo $! > /tmp/egui-app.pid
            sleep 15
            scrot /tmp/shot-seeded.png
            kill $(cat /tmp/egui-app.pid); wait 2>/dev/null; sleep 1
            CA_DATA_DIR=/tmp/egui-seed CA_EGUI_DARK=1 ./target/debug/computer-agent-egui & echo $! > /tmp/egui-app.pid
            sleep 15
            scrot /tmp/shot-dark.png
            kill $(cat /tmp/egui-app.pid); wait 2>/dev/null
          ' || true
          cp /tmp/shot-fresh.png preview-out/egui-fresh.png 2>/dev/null || true
          cp /tmp/shot-seeded.png preview-out/egui-seeded.png 2>/dev/null || true
          cp /tmp/shot-dark.png preview-out/egui-dark.png 2>/dev/null || true
          ls -la preview-out/ || true
          # A black 1280x800 capture compresses to ~3KB; a real painted
          # window is 50KB+. Anything smaller (or missing) means the app
          # never painted, so drop it and let the fallback below run.
          good=0
          for f in preview-out/egui-fresh.png preview-out/egui-seeded.png preview-out/egui-dark.png; do
            if [ -f "$f" ] && [ "$(stat -c%s "$f")" -gt 20000 ]; then
              good=$((good + 1))
            else
              echo "REJECTED $f (missing or too small)"
              rm -f "$f"
            fi
          done
          echo "good captures: $good/3"
      - name: fallback to kittest snapshots when xvfb capture failed
        run: |
          if [ "$(ls preview-out/*.png 2>/dev/null | wc -l)" -lt 3 ]; then
            echo "xvfb capture failed; generating egui_kittest snapshots instead"
            UPDATE_SNAPSHOTS=true cargo test -p computer-agent-frontend-egui --jobs 2 -- --test-threads=2
            cp crates/frontend-egui/tests/snapshots/*.png preview-out/
          fi
      - name: upload egui screenshots
        uses: actions/upload-artifact@v4
        with:
          name: preview-egui-${{ github.ref_name }}
          path: preview-out/
          if-no-files-found: error
