[package]
name = "computer-agent-frontend-egui"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
eframe = "0.36"
egui = "0.36"
egui_commonmark = "0.25"
egui_extras = { version = "0.36", features = ["svg"] }
merman = "0.9.0"
pulldown-cmark = "0.13"
tokio = { workspace = true, features = ["sync"] }
command-api = { path = "../command-api" }
computer-agent-engine = { path = "../engine" }
computer-agent-session-store = { path = "../session-store" }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
tokio = { workspace = true }
